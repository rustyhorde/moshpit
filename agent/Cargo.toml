[package]
authors.workspace = true
categories.workspace = true
description = "moshpit agent — holds identity keys in memory and serves them over a Unix socket"
documentation = "https://github.com/rustyhorde/moshpit#moshpit-agent-mpa"
edition.workspace = true
keywords.workspace = true
license.workspace = true
name = "moshpit-agent"
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "mpa"
path = "src/main.rs"

[features]
unstable = ["libmoshpit/unstable"]
# OS keyring integration via libsecret (GNOME Keyring / KWallet)
secret-service = ["dep:secret-service"]
# macOS Keychain
macos-keychain = ["dep:security-framework"]
# FIDO2 / passkey / YubiKey (no extra dep — uses system libfido2 via FFI stub)
fido2 = []
# TPM 2.0 sealing
tpm = ["dep:tss-esapi"]
# systemd credentials ($CREDENTIALS_DIRECTORY) — no extra dep needed
systemd-creds = []
# Fingerprint via fprintd D-Bus
fprintd = ["dep:zbus"]
# Derive vault key from SSH agent challenge-response — no extra dep needed
ssh-agent-piggyback = []

[dependencies]
anyhow = { workspace = true }
argon2 = { workspace = true }
aws-lc-rs = { workspace = true }
base64 = { workspace = true }
bincode-next = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
dialoguer = { workspace = true }
dirs2 = { workspace = true }
getset = { workspace = true }
libmoshpit = { workspace = true }
nix = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
tracing = { workspace = true }
vergen-pretty = { workspace = true }
zeroize = { workspace = true }

# Feature-gated optional deps
secret-service = { workspace = true, optional = true }
security-framework = { workspace = true, optional = true }
tss-esapi = { workspace = true, optional = true }
zbus = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[build-dependencies]
anyhow = { workspace = true }
pkg-config = { workspace = true }
rustversion = { workspace = true }
vergen-gix = { workspace = true }

[[package.metadata.cargo-matrix.channel]]
name = "default"
always_deny = [
  "secret-service",
  "macos-keychain",
  "fido2",
  "fprintd",
  "secret-service",
  "ssh-agent-piggyback",
  "systemd-creds",
  "tpm",
]

[[package.metadata.cargo-matrix.channel]]
name = "linux"
# secret-service matches the dep name so cargo-matrix treats it as an implicit dep-feature;
# include_optional re-adds it explicitly to the powerset seed.
include_optional = ["secret-service"]
# security-framework is guarded #![cfg(target_vendor = "apple")] — hard compile error on Linux.
always_deny = ["macos-keychain"]
mutually_exclusive = [
  [
    "fido2",
    "fprintd",
    "secret-service",
    "ssh-agent-piggyback",
    "systemd-creds",
    "tpm",
  ],
]

[[package.metadata.cargo-matrix.channel]]
name = "macos"
# tpm2-tss not in standard Homebrew; fprintd/secret-service/systemd-creds are Linux-specific.
always_deny = ["fprintd", "secret-service", "systemd-creds", "tpm"]
mutually_exclusive = [["fido2", "macos-keychain", "ssh-agent-piggyback"]]

[[package.metadata.cargo-matrix.channel]]
name = "windows"
# No system libraries available; macos-keychain/fido2/tpm require non-Windows SDKs.
always_deny = [
  "fido2",
  "fprintd",
  "macos-keychain",
  "secret-service",
  "systemd-creds",
  "tpm",
]
