[workspace]
resolver = "3"

members = ["agent", "keygen","libmoshpit", "moshpit", "moshpits", "xtask"]

[workspace.package]
authors = ["Jason Ozias <jason.g.ozias@gmail.com>"]
categories = ["command-line-interface", "network-programming", "cryptography"]
edition = "2024"
keywords = ["ssh", "mosh"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://git.jasonozias.com/moshpit.git"
rust-version = "1.96.0"
version = "0.9.4"

[workspace.dependencies]
ansi-control-codes = { version = "1.0.1", features = ["parser", "explain"] }
anyhow = "1.0.104"
argon2 = { version = "0.6.0-rc.8", features = ["getrandom"] }
aws-lc-rs = "1.18.0"
base64 = "0.23.1"
bincode-next = "3.1.1"
bishop = "1.0.0"
bon = "3.9.3"
bytes = "1.12.1"
clap = { version = "4.6.5", features = ["derive"] }
clap_complete = "4.6.9"
clap_mangen = "0.3.2"
config = { version = "0.15.25", features = ["toml"] }
crossterm = "0.29.0"
dialoguer = "0.12.0"
dirs2 = "3.0.1"
getset = "0.1.7"
libc = "1.0.0-alpha.4"
libmoshpit = { version = "0.9.4", path = "libmoshpit" }
nix = { version = "0.31.3", features = ["process", "signal", "socket", "user"] }
pkg-config = "0.3.33"
portable-pty = "0.9.0"
proptest = "1.11.0"
regex = "1.13.1"
rustversion = "1.0.23"
secret-service = { version = "5.1.0", features = ["rt-tokio-crypto-rust"] }
security-framework = "3.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = { version = "0.6.5", features = ["all"] }
tempfile = "3.27.0"
terminal_size = "0.4.4"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
] }
tokio-util = "0.7.19"
toml = "1.1.4"
tracing = { version = "0.1.44", features = [
  "max_level_trace",
  "release_max_level_trace",
] }
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = [
  "env-filter",
  "fmt",
  "time",
] }
tracing-subscriber-init = { version = "0.2.6", features = ["tstime"] }
tss-esapi = "7.7.0"
uuid = { version = "1.24.0", features = ["v4"] }
vergen-gix = { version = "10.0.2", features = [
  "build",
  "cargo",
  "rustc",
  "si",
] }
vergen-pretty = { version = "10.0.2", features = ["color", "tracing", "rkyv", "serde"] }
vt100 = "0.16.2"
whoami = "2.1.2"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
] }
zbus = "5.18.0"
zeroize = { version = "1.9.0", features = ["zeroize_derive"] }
zstd = "0.13.3"
